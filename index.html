function go(d){
  if(d>0&&step>=0&&step<S.length){let bad=null;S[step].qs.filter(vis).forEach(q=>{const v=A[q.id];const empty=!v||(Array.isArray(v)&&!v.length)||!String(v).trim();if(q.req&&empty){document.getElementById("q_"+q.id).classList.add("err");bad=bad||q.id}});
    if(bad){document.getElementById("q_"+bad).scrollIntoView({behavior:"smooth",block:"center"});return}}
  step=Math.max(-1,Math.min(S.length,step+d));render();scrollTo({top:0,behavior:"smooth"})}
function summary(){const L=["FORMULARIO JUSTFLOW · "+(A.nombre||""),""];S.forEach(s=>{L.push("== "+s.t.toUpperCase()+" ==");s.qs.filter(vis).forEach(q=>{let v=A[q.id];if(Array.isArray(v))v=v.join(", ");if(v==="Otro"&&A[q.id+"_otro"])v="Otro: "+A[q.id+"_otro"];L.push("• "+q.q+": "+(v&&String(v).trim()?v:"—"))});L.push("")});return L.join("\n")}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1800)}
function mail(){location.href=`mailto:${MAIL}?subject=${encodeURIComponent("Formulario JustFlow · "+(A.nombre||""))}&body=${encodeURIComponent(summary())}`}
function copy(){(navigator.clipboard?navigator.clipboard.writeText(summary()):Promise.reject()).then(()=>toast("Respuestas copiadas"),()=>{const t=document.createElement("textarea");t.value=summary();document.body.appendChild(t);t.select();try{document.execCommand("copy");toast("Respuestas copiadas")}catch(e){toast("Selecciona el texto y cópialo")}t.remove()})}
function dl(){const b=new Blob([summary()],{type:"text/plain"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="formulario-justflow-"+(A.nombre||"negocio").toLowerCase().replace(/[^a-z0-9]+/g,"-")+".txt";a.click()}
render();
</script></body></html>
